[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "j-ai"
version = "0.1.0"
description = "A practical 3B Hebrew/multilingual AI training and serving pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.46,<5",
  "huggingface-hub>=0.26",
  "accelerate>=1.1",
  "bitsandbytes>=0.44",
  "peft>=0.13",
  "datasets>=3.1",
  "safetensors>=0.4",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
jai-prepare = "j_ai.prepare:main"
jai-download = "j_ai.download:main"
jai-train = "j_ai.train:main"
jai-chat = "j_ai.chat:main"
jai-evaluate = "j_ai.evaluate:main"
jai-merge = "j_ai.merge:main"
jai-serve = "j_ai.serve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
